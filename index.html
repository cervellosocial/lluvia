<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneo Dobles Tenis - Sorteador Rotativo</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-dark: #1b5e20;
      --accent: #cddc39;
      --court-green: #388e3c;
      --court-lines: #ffffff;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --card-border: #333333;
      --text: #e0e0e0;
      --text-muted: #a0a0a0;
      --danger: #cf6679;
      --warning: #ffb74d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    header {
      width: 100%;
      background-color: var(--primary-dark);
      color: white;
      text-align: center;
      padding: 18px 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-accent {
      background-color: var(--accent);
      color: #000;
    }

    .btn-danger {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-generate {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(205, 220, 57, 0.3);
    }

    .player-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tag {
      background-color: #2a2a2a;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag .remove {
      cursor: pointer;
      color: var(--danger);
      font-weight: bold;
    }

    .match-card {
      background: linear-gradient(135deg, #1e3c20 0%, #122513 100%);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .match-header {
      font-size: 0.85rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-align: center;
      font-weight: bold;
    }

    .match-court {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: var(--court-green);
      border: 2px solid var(--court-lines);
      border-radius: 8px;
      padding: 12px;
      position: relative;
    }

    .team {
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      color: #fff;
      font-size: 1.05rem;
    }

    .vs-divider {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 900;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: -4px 0;
    }

    .resting-box {
      background-color: #2a2215;
      border: 1px dashed var(--warning);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      text-align: center;
      color: var(--warning);
      font-size: 0.9rem;
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      background-color: rgba(207, 102, 121, 0.15);
      border: 1px solid var(--danger);
      color: #ff8a80;
      font-size: 0.9rem;
      margin-top: 10px;
      display: none;
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    .stats-table th, .stats-table td {
      border: 1px solid #333;
      padding: 8px;
      text-align: center;
    }

    .stats-table th {
      background-color: #252525;
      color: var(--accent);
    }

    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .tab.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: bold;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 20px 0;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎾 Sorteo Dobles Tenis</h1>
  </header>

  <div class="container">

    <div class="tabs">
      <div class="tab active" onclick="switchTab('sorteo')">Sorteo</div>
      <div class="tab" onclick="switchTab('jugadores')">Jugadores</div>
      <div class="tab" onclick="switchTab('historial')">Historial</div>
    </div>

    <!-- TAB: SORTEO -->
    <div id="tab-sorteo" class="tab-content active">
      <div class="card">
        <button class="btn btn-accent btn-generate" onclick="generarRonda()">
          🎲 Generar Siguiente Ronda
        </button>
        <div id="alert-box" class="alert"></div>
      </div>

      <div id="partidos-container" style="margin-top: 15px;">
        <div class="empty-state">Presiona el botón para generar el primer emparejamiento.</div>
      </div>
    </div>

    <!-- TAB: JUGADORES -->
    <div id="tab-jugadores" class="tab-content">
      <div class="card">
        <h2>Añadir Jugador</h2>
        <div class="input-group">
          <input type="text" id="player-input" placeholder="Nombre del jugador" onkeypress="handleKeyPress(event)">
          <button class="btn btn-primary" onclick="agregarJugador()">Añadir</button>
        </div>
      </div>

      <div class="card" style="margin-top: 15px;">
        <h2>
          <span>Jugadores registrados (<span id="player-count">0</span>)</span>
          <button class="btn btn-danger" onclick="reiniciarTorneo()">Reiniciar Todo</button>
        </h2>
        <div id="player-list" class="player-tags"></div>
      </div>
    </div>

    <!-- TAB: HISTORIAL -->
    <div id="tab-historial" class="tab-content">
      <div class="card">
        <h2>Rondas Anteriores</h2>
        <div id="history-container">
          <div class="empty-state">Aún no se han jugado rondas.</div>
        </div>
      </div>

      <div class="card" style="margin-top: 15px;">
        <h2>Matriz de Parejas</h2>
        <div style="overflow-x: auto;">
          <table class="stats-table" id="pair-matrix">
            <!-- Renderizado dinámico -->
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ESTADO DE LA APLICACIÓN
    let players = JSON.parse(localStorage.getItem('tenis_players')) || [
      "Jugador 1", "Jugador 2", "Jugador 3", "Jugador 4"
    ];
    // Estructura de parejas jugadas: { "NombreA|NombreB": cantidad }
    let pairsHistory = JSON.parse(localStorage.getItem('tenis_pairs_history')) || {};
    // Estructura de descansos: { "NombreA": cantidad }
    let restHistory = JSON.parse(localStorage.getItem('tenis_rest_history')) || {};
    // Historial de rondas completas
    let rounds = JSON.parse(localStorage.getItem('tenis_rounds')) || [];

    // INICIALIZACIÓN
    document.addEventListener('DOMContentLoaded', () => {
      actualizarListaJugadores();
      if (rounds.length > 0) {
        renderizarRondaActual(rounds[rounds.length - 1]);
      }
      renderizarHistorial();
      renderizarMatriz();
    });

    function guardarEstado() {
      localStorage.setItem('tenis_players', JSON.stringify(players));
      localStorage.setItem('tenis_pairs_history', JSON.stringify(pairsHistory));
      localStorage.setItem('tenis_rest_history', JSON.stringify(restHistory));
      localStorage.setItem('tenis_rounds', JSON.stringify(rounds));
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabName === 'sorteo') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('tab-sorteo').classList.add('active');
      } else if (tabName === 'jugadores') {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('tab-jugadores').classList.add('active');
      } else if (tabName === 'historial') {
        document.querySelectorAll('.tab')[2].classList.add('active');
        document.getElementById('tab-historial').classList.add('active');
        renderizarHistorial();
        renderizarMatriz();
      }
    }

    // GESTIÓN DE JUGADORES
    function agregarJugador() {
      const input = document.getElementById('player-input');
      const nombre = input.value.trim();
      
      if (!nombre) return;
      if (players.includes(nombre)) {
        alert('Ya existe un jugador con este nombre.');
        return;
      }

      players.push(nombre);
      input.value = '';
      actualizarListaJugadores();
      guardarEstado();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') agregarJugador();
    }

    function eliminarJugador(nombre) {
      players = players.filter(p => p !== nombre);
      actualizarListaJugadores();
      guardarEstado();
    }

    function actualizarListaJugadores() {
      const listContainer = document.getElementById('player-list');
      const countSpan = document.getElementById('player-count');
      
      countSpan.innerText = players.length;
      listContainer.innerHTML = '';

      players.forEach(p => {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.innerHTML = `
          <span>${p}</span>
          <span class="remove" onclick="eliminarJugador('${p}')">&times;</span>
        `;
        listContainer.appendChild(tag);
      });
    }

    function getKey(p1, p2) {
      return [p1, p2].sort().join('|');
    }

    function hanJugadoJuntos(p1, p2) {
      const key = getKey(p1, p2);
      return (pairsHistory[key] || 0) > 0;
    }

    // ALGORITMO DE EMPAREJAMIENTO SOBERANO Y SIN DUPLICADOS
    function generarRonda() {
      const alertBox = document.getElementById('alert-box');
      alertBox.style.display = 'none';

      if (players.length < 4) {
        alertBox.innerText = 'Se necesitan al menos 4 jugadores para formar un partido de dobles.';
        alertBox.style.display = 'block';
        return;
      }

      // 1. Seleccionar quiénes van a jugar y quiénes descansan
      const numPartidos = Math.floor(players.length / 4);
      const numJugadoresActivos = numPartidos * 4;
      
      // Ordenar jugadores por número de descansos (los que menos han descansado tienen preferencia para descansar)
      let ordenadosPorDescanso = [...players].sort((a, b) => {
        const restA = restHistory[a] || 0;
        const restB = restHistory[b] || 0;
        return restA - restB; // Menos descansos primero
      });

      // Añadir un toque de aleatoriedad entre los que tienen igual número de descansos
      ordenadosPorDescanso.sort((a, b) => {
        const restDiff = (restHistory[a] || 0) - (restHistory[b] || 0);
        if (restDiff === 0) return Math.random() - 0.5;
        return restDiff;
      });

      const descansan = ordenadosPorDescanso.slice(0, players.length - numJugadoresActivos);
      const juegan = players.filter(p => !descansan.includes(p));

      // 2. Intentar buscar un emparejamiento válido (backtracking/fuerza bruta controlada)
      let resultadoMatches = resolverEmparejamientos(juegan);

      if (!resultadoMatches) {
        alertBox.innerText = '⚠️ Se han agotado las combinaciones de parejas sin repetir. Si deseas continuar, se tendrán que empezar a repetir parejas.';
        alertBox.style.display = 'block';
        
        // Intentar permitiendo repeticiones si se agotaron todas las opciones limpias
        resultadoMatches = resolverEmparejamientos(juegan, true);
      }

      if (!resultadoMatches) {
        alertBox.innerText = 'Error al calcular los partidos. Por favor, reintenta.';
        alertBox.style.display = 'block';
        return;
      }

      // 3. Registrar los datos
      descansan.forEach(p => {
        restHistory[p] = (restHistory[p] || 0) + 1;
      });

      resultadoMatches.forEach(m => {
        const key1 = getKey(m.pareja1[0], m.pareja1[1]);
        const key2 = getKey(m.pareja2[0], m.pareja2[1]);
        pairsHistory[key1] = (pairsHistory[key1] || 0) + 1;
        pairsHistory[key2] = (pairsHistory[key2] || 0) + 1;
      });

      const nuevaRonda = {
        numero: rounds.length + 1,
        partidos: resultadoMatches,
        descansan: descansan
      };

      rounds.push(nuevaRonda);
      guardarEstado();

      renderizarRondaActual(nuevaRonda);
    }

    // Algoritmo recursivo para formar parejas
    function resolverEmparejamientos(jugadoresDisponibles, permitirRepetidos = false) {
      // Probar hasta 100 intentos con mezclas aleatorias para encontrar rápido una solución válida
      for (let intento = 0; intento < 100; intento++) {
        let pool = [...jugadoresDisponibles].sort(() => Math.random() - 0.5);
        let partidos = [];
        let exito = true;

        while (pool.length >= 4) {
          let p1 = pool.pop();
          
          // Buscar pareja para p1 que NO hayan jugado juntos
          let indicePareja = -1;
          for (let i = 0; i < pool.length; i++) {
            if (permitirRepetidos || !hanJugadoJuntos(p1, pool[i])) {
              indicePareja = i;
              break;
            }
          }

          if (indicePareja === -1) {
            exito = false;
            break; // Falló esta configuración
          }

          let p2 = pool.splice(indicePareja, 1)[0];

          // Buscar segunda pareja (p3 y p4)
          let p3 = pool.pop();
          let indicePareja2 = -1;
          for (let i = 0; i < pool.length; i++) {
            if (permitirRepetidos || !hanJugadoJuntos(p3, pool[i])) {
              indicePareja2 = i;
              break;
            }
          }

          if (indicePareja2 === -1) {
            exito = false;
            break;
          }

          let p4 = pool.splice(indicePareja2, 1)[0];

          partidos.push({
            pareja1: [p1, p2],
            pareja2: [p3, p4]
          });
        }

        if (exito) return partidos;
      }

      return null;
    }

    // RENDERIZADO
    function renderizarRondaActual(ronda) {
      const container = document.getElementById('partidos-container');
      container.innerHTML = `<h3 style="margin-bottom: 12px; color: var(--accent);">Ronda ${ronda.numero}</h3>`;

      ronda.partidos.forEach((m, idx) => {
        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
          <div class="match-header">Pista ${idx + 1}</div>
          <div class="match-court">
            <div class="team">${m.pareja1[0]} & ${m.pareja1[1]}</div>
            <div class="vs-divider">VS</div>
            <div class="team">${m.pareja2[0]} & ${m.pareja2[1]}</div>
          </div>
        `;
        container.appendChild(card);
      });

      if (ronda.descansan && ronda.descansan.length > 0) {
        const restBox = document.createElement('div');
        restBox.className = 'resting-box';
        restBox.innerHTML = `⏳ <strong>Descansan esta ronda:</strong> ${ronda.descansan.join(', ')}`;
        container.appendChild(restBox);
      }
    }

    function renderizarHistorial() {
      const container = document.getElementById('history-container');
      if (rounds.length === 0) {
        container.innerHTML = '<div class="empty-state">Aún no se han jugado rondas.</div>';
        return;
      }

      container.innerHTML = '';
      [...rounds].reverse().forEach(r => {
        const item = document.createElement('div');
        item.style.marginBottom = '15px';
        item.style.borderBottom = '1px solid #333';
        item.style.paddingBottom = '10px';

        let partidosHTML = r.partidos.map(m => 
          `<div style="font-size:0.9rem; margin: 4px 0;">🎾 <strong>${m.pareja1.join(' / ')}</strong> vs <strong>${m.pareja2.join(' / ')}</strong></div>`
        ).join('');

        let descansoHTML = r.descansan.length ? `<div style="font-size:0.8rem; color:var(--warning);">Descansó: ${r.descansan.join(', ')}</div>` : '';

        item.innerHTML = `
          <strong style="color:var(--accent);">Ronda ${r.numero}</strong>
          ${partidosHTML}
          ${descansoHTML}
        `;
        container.appendChild(item);
      });
    }

    function renderizarMatriz() {
      const table = document.getElementById('pair-matrix');
      if (players.length === 0) {
        table.innerHTML = '';
        return;
      }

      let headerHTML = '<tr><th></th>' + players.map(p => `<th>${p.substring(0,4)}.</th>`).join('') + '</tr>';
      let bodyHTML = '';

      players.forEach((p1, i) => {
        bodyHTML += `<tr><th>${p1}</th>`;
        players.forEach((p2, j) => {
          if (i === j) {
            bodyHTML += '<td style="background:#222; color:#555;">-</td>';
          } else {
            const count = pairsHistory[getKey(p1, p2)] || 0;
            const color = count > 0 ? 'color: var(--accent); font-weight:bold;' : 'color:#555;';
            bodyHTML += `<td style="${color}">${count}</td>`;
          }
        });
        bodyHTML += '</tr>';
      });

      table.innerHTML = headerHTML + bodyHTML;
    }

    function reiniciarTorneo() {
      if (confirm('¿Estás seguro de que deseas borrar todo el historial de rondas y parejas? Los jugadores se mantendrán.')) {
        pairsHistory = {};
        restHistory = {};
        rounds = [];
        guardarEstado();
        document.getElementById('partidos-container').innerHTML = '<div class="empty-state">Presiona el botón para generar el primer emparejamiento.</div>';
        renderizarHistorial();
        renderizarMatriz();
        alert('Torneo reiniciado correctamente.');
      }
    }
  </script>
</body>
</html>
