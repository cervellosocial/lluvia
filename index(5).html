<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planificador Escolar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #F8F6F0;
    color: #2D3748;
  }
  .ghost-drag { opacity: 0.4; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const STORAGE_KEY = "planificador-escolar-data";

const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
const FRANJAS = ["16:00–17:00", "17:00–18:00", "18:00–19:00", "19:00–20:00", "20:00–21:00", "21:00–22:00"];
const PALETA_COLORES = [
  { id: "coral", bg: "bg-orange-100", text: "text-orange-800", badge: "bg-orange-500" },
  { id: "purple", bg: "bg-purple-100", text: "text-purple-800", badge: "bg-purple-500" },
  { id: "green", bg: "bg-emerald-100", text: "text-emerald-800", badge: "bg-emerald-500" },
  { id: "blue", bg: "bg-blue-100", text: "text-blue-800", badge: "bg-blue-500" },
  { id: "rose", bg: "bg-rose-100", text: "text-rose-800", badge: "bg-rose-500" }
];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

function App() {
  const [grupos, setGrupos] = useState({});
  const [draggedItem, setDraggedItem] = useState(null);
  const [modalOpen, setModalOpen] = useState(false);
  const [targetSlot, setTargetSlot] = useState(null);
  
  // Datos del nuevo alumno
  const [nombre, setNombre] = useState("");
  const [nivel, setNivel] = useState("Iniciación");
  const [colorSel, setColorSel] = useState(PALETA_COLORES[0].id);

  // Cargar datos
  useEffect(() => {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try { setGrupos(JSON.parse(raw)); } catch (e) {}
    } else {
      // Estado inicial vacío para cada hueco
      const init = {};
      DIAS.forEach(d => {
        FRANJAS.forEach(f => {
          init[`${d}_${f}`] = { nivel: "Iniciación", alumnos: [] };
        });
      });
      setGrupos(init);
    }
  }, []);

  // Guardar cambios
  useEffect(() => {
    if (Object.keys(grupos).length > 0) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(grupos));
    }
  }, [grupos]);

  const getIniciales = (nom) => {
    if (!nom) return "?";
    const parts = nom.trim().split(" ");
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return nom.slice(0, 2).toUpperCase();
  };

  // --- Mover y Duplicar con Drag & Drop ---
  const handleDragStart = (e, slotKey, alumno, isDuplicate = false) => {
    setDraggedItem({ fromSlot: slotKey, alumno, isDuplicate });
    e.dataTransfer.effectAllowed = isDuplicate ? "copy" : "move";
  };

  const handleDragOver = (e) => {
    e.preventDefault();
  };

  const handleDrop = (e, toSlotKey) => {
    e.preventDefault();
    if (!draggedItem) return;

    const { fromSlot, alumno, isDuplicate } = draggedItem;
    const destGroup = grupos[toSlotKey] || { nivel: "Iniciación", alumnos: [] };

    // Validar límite máximo de 4 alumnos
    if (destGroup.alumnos.length >= 4 && (fromSlot !== toSlotKey || isDuplicate)) {
      alert("¡Este grupo ya ha alcanzado el límite máximo de 4 alumnos!");
      setDraggedItem(null);
      return;
    }

    setGrupos(prev => {
      const next = { ...prev };
      
      // Si no es duplicado, eliminar del origen
      if (!isDuplicate && fromSlot !== toSlotKey) {
        next[fromSlot] = {
          ...next[fromSlot],
          alumnos: next[fromSlot].alumnos.filter(a => a.id !== alumno.id)
        };
      }

      // Añadir al destino (si se duplica, generamos un ID nuevo)
      const alumnoAInsertar = isDuplicate ? { ...alumno, id: uid() } : alumno;
      
      // Evitar duplicados del mismo objeto exacto en la misma celda
      if (!next[toSlotKey].alumnos.some(a => a.id === alumnoAInsertar.id)) {
        next[toSlotKey] = {
          ...next[toSlotKey],
          alumnos: [...next[toSlotKey].alumnos, alumnoAInsertar]
        };
      }

      return next;
    });

    setDraggedItem(null);
  };

  // --- CRUD Alumnos ---
  const abrirModalAñadir = (slotKey) => {
    const g = grupos[slotKey] || { alumnos: [] };
    if (g.alumnos.length >= 4) {
      alert("El grupo ya está lleno (4/4).");
      return;
    }
    setTargetSlot(slotKey);
    setNombre("");
    setModalOpen(true);
  };

  const guardarNuevoAlumno = (e) => {
    e.preventDefault();
    if (!nombre.trim() || !targetSlot) return;

    const nuevo = {
      id: uid(),
      nombre: nombre.trim(),
      color: colorSel
    };

    setGrupos(prev => ({
      ...prev,
      [targetSlot]: {
        nivel: prev[targetSlot]?.nivel || nivel,
        alumnos: [...(prev[targetSlot]?.alumnos || []), nuevo]
      }
    }));

    setModalOpen(false);
  };

  const eliminarAlumno = (slotKey, alumnoId) => {
    setGrupos(prev => ({
      ...prev,
      [slotKey]: {
        ...prev[slotKey],
        alumnos: prev[slotKey].alumnos.filter(a => a.id !== alumnoId)
      }
    }));
  };

  const cambiarNivelGrupo = (slotKey, nuevoNivel) => {
    setGrupos(prev => ({
      ...prev,
      [slotKey]: { ...prev[slotKey], nivel: nuevoNivel }
    }));
  };

  const duplicarAlumnoDirecto = (slotKey, alumno) => {
    const g = grupos[slotKey];
    if (g.alumnos.length >= 4) {
      alert("No hay espacio suficiente en este grupo para duplicar.");
      return;
    }
    const clon = { ...alumno, id: uid() };
    setGrupos(prev => ({
      ...prev,
      [slotKey]: {
        ...prev[slotKey],
        alumnos: [...prev[slotKey].alumnos, clon]
      }
    }));
  };

  return (
    <div className="min-h-screen pb-12">
      {/* Barra Superior */}
      <header className="bg-[#FAF8F3] border-b border-[#EAE6DB] px-8 py-4 mb-6 sticky top-0 z-10 shadow-sm">
        <div className="max-w-[1600px] mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-xl">
              📅
            </div>
            <div>
              <h1 className="text-xl font-bold text-gray-800">Calendario Escolar</h1>
              <p className="text-xs text-gray-500">Lun–Vie · 16:00–22:00</p>
            </div>
          </div>
          <div className="bg-emerald-50 text-emerald-700 text-xs px-3 py-1.5 rounded-full border border-emerald-200 font-medium">
            💡 Arrasta un alumno para moverlo. Mantén <kbd className="bg-white px-1 border rounded shadow-xs">Alt</kbd> al arrastrar o usa 📋 para duplicar.
          </div>
        </div>
      </header>

      {/* Grid del Calendario */}
      <main className="max-w-[1600px] mx-auto px-4 overflow-x-auto">
        <div className="min-w-[1200px]">
          {/* Cabecera de Días */}
          <div className="grid grid-cols-6 gap-3 mb-3 text-center">
            <div className="text-xs font-semibold text-gray-400 self-end pb-2">Horario</div>
            {DIAS.map(d => (
              <div key={d} className="font-bold text-gray-700 bg-[#EFECE3] py-2.5 rounded-xl text-sm">
                {d}
              </div>
            ))}
          </div>

          {/* Filas por Franja Horaria */}
          {FRANJAS.map(franja => (
            <div key={franja} className="grid grid-cols-6 gap-3 mb-4 items-stretch">
              {/* Columna con la Franja Horaria */}
              <div className="flex items-center justify-center">
                <span className="bg-[#EAE6DB] text-gray-600 font-semibold text-xs px-3 py-2 rounded-full">
                  {franja}
                </span>
              </div>

              {/* Columna para cada Día */}
              {DIAS.map(dia => {
                const slotKey = `${dia}_${franja}`;
                const grupo = grupos[slotKey] || { nivel: "Iniciación", alumnos: [] };
                const estaLleno = grupo.alumnos.length >= 4;

                return (
                  <div
                    key={slotKey}
                    onDragOver={handleDragOver}
                    onDrop={(e) => handleDrop(e, slotKey)}
                    className="bg-[#FFFDF9] border border-[#EAE6DB] rounded-2xl p-3 flex flex-col justify-between shadow-xs hover:border-orange-200 transition-colors min-h-[180px]"
                  >
                    {/* Header de Tarjeta: Nivel y Edición */}
                    <div className="flex items-center justify-between mb-2">
                      <select
                        value={grupo.nivel}
                        onChange={(e) => cambiarNivelGrupo(slotKey, e.target.value)}
                        className="text-[11px] font-bold tracking-wide rounded-full px-2 py-0.5 border-none outline-none cursor-pointer bg-emerald-100 text-emerald-800"
                      >
                        <option value="Iniciación">● Iniciación</option>
                        <option value="Competición">● Competición</option>
                        <option value="Perfeccionamiento">● Perfeccionamiento</option>
                      </select>
                    </div>

                    {/* Lista de Alumnos */}
                    <div className="flex flex-col gap-1.5 flex-grow justify-start my-1">
                      {grupo.alumnos.length === 0 ? (
                        <div className="h-full flex items-center justify-center text-xs italic text-gray-300">
                          Sin alumnos
                        </div>
                      ) : (
                        grupo.alumnos.map(alumno => {
                          const configColor = PALETA_COLORES.find(c => c.id === alumno.color) || PALETA_COLORES[0];

                          return (
                            <div
                              key={alumno.id}
                              draggable
                              onDragStart={(e) => handleDragStart(e, slotKey, alumno, e.altKey)}
                              className={`group relative flex items-center justify-between p-1.5 rounded-xl border border-black/5 bg-white shadow-xs cursor-grab active:cursor-grabbing hover:shadow-sm transition-all`}
                            >
                              <div className="flex items-center gap-2 overflow-hidden">
                                {/* Grip Drag Icon */}
                                <span className="text-gray-300 text-xs pl-0.5">░</span>
                                
                                {/* Avatar */}
                                <div className={`w-6 h-6 rounded-lg ${configColor.bg} ${configColor.text} flex items-center justify-center text-[10px] font-bold shrink-0`}>
                                  {getIniciales(alumno.nombre)}
                                </div>
                                
                                {/* Nombre */}
                                <span className="text-xs font-semibold text-gray-700 truncate">
                                  {alumno.nombre}
                                </span>
                              </div>

                              {/* Acciones flotantes al pasar el ratón */}
                              <div className="opacity-0 group-hover:opacity-100 flex items-center gap-1 transition-opacity bg-white pl-1">
                                <button
                                  onClick={() => duplicarAlumnoDirecto(slotKey, alumno)}
                                  title="Duplicar alumno"
                                  className="text-[10px] p-0.5 hover:bg-gray-100 rounded text-gray-500"
                                >
                                  📋
                                </button>
                                <button
                                  onClick={() => eliminarAlumno(slotKey, alumno.id)}
                                  title="Eliminar"
                                  className="text-[10px] p-0.5 hover:bg-red-50 text-red-500 rounded"
                                >
                                  ✕
                                </button>
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>

                    {/* Footer de Tarjeta: Contador y Botón Añadir */}
                    <div className="flex items-center justify-between pt-2 border-t border-[#F2EFE7] text-[11px]">
                      <span className={`font-semibold ${estaLleno ? "text-orange-600" : "text-gray-400"}`}>
                        👥 {grupo.alumnos.length}/4
                      </span>
                      {!estaLleno && (
                        <button
                          onClick={() => abrirModalAñadir(slotKey)}
                          className="text-orange-600 font-semibold hover:text-orange-700 hover:bg-orange-50 px-2 py-0.5 rounded-md transition-colors"
                        >
                          + Añadir
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </main>

      {/* Modal para Añadir Alumno */}
      {modalOpen && (
        <div className="fixed inset-0 bg-black/30 backdrop-blur-xs flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl border border-gray-100">
            <h3 className="text-base font-bold text-gray-800 mb-4">Añadir Alumno al Grupo</h3>
            <form onSubmit={guardarNuevoAlumno} className="flex flex-col gap-4">
              <div>
                <label className="text-xs font-semibold text-gray-500 block mb-1">Nombre Completo</label>
                <input
                  type="text"
                  required
                  autoFocus
                  placeholder="Ej: Marc Soler"
                  value={nombre}
                  onChange={(e) => setNombre(e.target.value)}
                  className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-orange-500"
                />
              </div>

              <div>
                <label className="text-xs font-semibold text-gray-500 block mb-2">Color del Avatar</label>
                <div className="flex gap-2">
                  {PALETA_COLORES.map(c => (
                    <button
                      key={c.id}
                      type="button"
                      onClick={() => setColorSel(c.id)}
                      className={`w-7 h-7 rounded-full ${c.bg} ${c.text} font-bold text-xs flex items-center justify-center border-2 transition-transform ${colorSel === c.id ? "border-gray-800 scale-110" : "border-transparent"}`}
                    >
                      A
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex gap-2 justify-end pt-2">
                <button
                  type="button"
                  onClick={() => setModalOpen(false)}
                  className="px-4 py-2 text-xs font-semibold text-gray-500 hover:bg-gray-100 rounded-xl"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 text-xs font-semibold bg-orange-500 hover:bg-orange-600 text-white rounded-xl shadow-xs"
                >
                  Guardar Alumno
                </button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
